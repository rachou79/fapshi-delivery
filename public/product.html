<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Dernier Message - Saison 1</title>
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #f5f5f7;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: white;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    text-align: center;
    max-width: 400px;
    width: 100%;
  }
  img {
    width: 100%;
    border-radius: 12px;
    margin-bottom: 20px;
  }
  h1 { font-size: 22px; margin-bottom: 8px; }
  .price { font-size: 20px; font-weight: 700; color: #16a34a; margin-bottom: 16px; }
  p { color: #555; font-size: 14px; line-height: 1.5; }
  .btn {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 16px;
    background: #16a34a;
    color: white;
    text-decoration: none;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
  }
  .btn:disabled { background: #94a3b8; }
  .error { color: #dc2626; margin-top: 12px; font-size: 14px; }
</style>
</head>
<body>
  <div class="card">
    <img src="/couverture.jpg" alt="Le Dernier Message" onerror="this.style.display='none'">
    <h1>Le Dernier Message — Saison 1</h1>
    <p>Série thriller et mystère en 10 épisodes. Nadia reçoit un mystérieux message qui va bouleverser sa vie.</p>
    <div class="price">5 000 XAF</div>
    <button class="btn" id="buyBtn" onclick="buyNow()">Acheter maintenant</button>
    <div id="errorMsg" class="error"></div>
