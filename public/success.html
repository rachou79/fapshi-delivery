<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmation de votre achat</title>
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #f5f5f7;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: white;
    padding: 40px 30px;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    text-align: center;
    max-width: 400px;
  }
  h1 { font-size: 20px; margin-bottom: 10px; }
  p { color: #555; font-size: 15px; }
  .btn {
    display: inline-block;
    margin-top: 20px;
    padding: 14px 28px;
    background: #16a34a;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 600;
  }
  .note {
    margin-top: 16px;
    padding: 12px;
    background: #fef3c7;
    border-radius: 8px;
    font-size: 13px;
    color: #92400e;
    text-align: left;
  }
  .loader {
    border: 3px solid #eee;
    border-top: 3px solid #16a34a;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    animation: spin 1s linear infinite;
    margin: 20px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: #dc2626; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="loader"></div>
    <h1>Vérification de votre paiement...</h1>
    <p>Merci de patienter quelques secondes.</p>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const transId = params.get("transId");
  const card = document.getElementById("card");

  if (!transId) {
    card.innerHTML = `<h1 class="error">ID de transaction manquant</h1>
      <p>Merci de nous contacter avec votre preuve de paiement.</p>`;
  } else {
    fetch(`/api/check-payment?transId=${encodeURIComponent(transId)}`)
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          card.innerHTML = `
            <h1>Paiement confirmé ✅</h1>
            <p>Merci pour votre achat ! Cliquez ci-dessous pour télécharger votre produit.</p>
            <a class="btn" href="${data.downloadUrl}" target="_blank">Télécharger le fichier</a>
            <div class="note">
              ⚠️ Google Drive peut afficher un message disant qu'il ne peut pas analyser le fichier (car il est volumineux). C'est normal — cliquez simplement sur <strong>"Télécharger quand même"</strong> pour continuer.
            </div>
          `;
        } else {
          card.innerHTML = `
            <h1 class="error">Paiement non confirmé</h1>
            <p>Statut : ${data.status || "en attente"}. Si vous avez bien payé,
            actualisez cette page dans quelques instants ou contactez-nous.</p>
          `;
        }
      })
      .catch(() => {
        card.innerHTML = `<h1 class="error">Erreur</h1>
          <p>Impossible de vérifier le paiement. Contactez le support avec votre reçu.</p>`;
      });
  }
</script>
</body>
</html>
